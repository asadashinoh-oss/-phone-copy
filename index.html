html <!DOCTYPE html> <html lang="ar" dir="rtl">  <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1"> <title>Vodafone Cash</title>  <style> * {     box-sizing: border-box; }  body {     margin: 0;     min-height: 100vh;     display: flex;     justify-content: center;     align-items: center;     background: #f4f6fa;     font-family: Arial, sans-serif; }  .container {     width: 88%;     max-width: 420px;     text-align: center; }  button {     width: 100%;     min-height: 85px;     padding: 22px;     border: none;     border-radius: 20px;     background: linear-gradient(135deg, #ff3333 0%, #e60000 45%, #a90000 100%);     color: #ffffff;     font-size: 25px;     font-weight: bold;     box-shadow: 0 8px 22px rgba(230, 0, 0, 0.25);     cursor: pointer; }  button:active {     transform: scale(0.97); }  #message {     color: #16834a;     font-size: 18px;     font-weight: bold;     margin-top: 22px; } </style> </head>  <body>  <div class="container">     <button id="copyBtn">فودافون كاش</button>     <p id="message"></p> </div>  <script> const phone = "*9*7*01080350089*";  document.getElementById("copyBtn").addEventListener("click", async () => {      try {         await navigator.clipboard.writeText(phone);          document.getElementById("message").innerText =             "تم نسخ الكود، جاري فتح لوحة الاتصال";          setTimeout(() => {             window.location.href = "tel:" + encodeURIComponent(phone);         }, 500);      } catch (error) {          document.getElementById("message").innerText =             "تعذر النسخ، حاول مرة أخرى";      }  }); </script>  </body> </html>
